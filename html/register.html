<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SCTTS - Register</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <div class="register-wrapper">

        <div class="register-card">

            <div class="bus-icon">
                🚌
            </div>

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Join Smart College Transport Tracking System
            </p>

            <p id="message" class="message"></p>


            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <button
                    type="submit"
                    class="register-btn"
                >
                    
                </button>

            </form>


            <p class="login-text">

                

                <a href="../html/login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="../js/register.js"></script>

</body>

</html>
