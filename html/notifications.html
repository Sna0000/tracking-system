
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCTTS - Notifications</title>
<link rel="stylesheet" href="../css/notifications.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="logo">🚌 <span>SCTTS</span></div>
    <nav class="nav-links">
      <a href="../html/dashboard.html">🏠 Home</a>
      <a href="../html/live-tracking.html">📍 Live Tracking</a>
      <a href="../html/notifications.html" class="active">🔔 Notifications</a>
      <a href="../html/schedule.html">🕒 Bus Schedule</a>
      <a href="../html/bus-details.html">🚍 Bus Details</a>
    </nav>
    <a href="../html/login.html" class="logout-btn">🚪 Logout</a>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <h1>Notifications</h1>
    </header>

    <section class="notif-list">

      <div class="notif-card">
        <div class="notif-icon">🚌</div>
        <div class="notif-text">
          <p>Bus 12 has reached Stop 3.</p>
          <span class="notif-time">10 minutes ago</span>
        </div>
      </div>

      <div class="notif-card">
        <div class="notif-icon">⏱️</div>
        <div class="notif-text">
          <p>Bus 07 will arrive in 10 minutes.</p>
          <span class="notif-time">15 minutes ago</span>
        </div>
      </div>

      <div class="notif-card warning">
        <div class="notif-icon">⚠️</div>
        <div class="notif-text">
          <p>Bus 15 is delayed by 5 minutes.</p>
          <span class="notif-time">2 hours ago</span>
        </div>
      </div>

      <div class="notif-card success">
        <div class="notif-icon">✅</div>
        <div class="notif-text">
          <p>Your bus has reached college.</p>
          <span class="notif-time">3 hours ago</span>
        </div>
      </div>

    </section>

  </main>

</div>

</body>
</html>
